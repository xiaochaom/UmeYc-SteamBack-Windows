[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "umeyc-steamback-windows"
version = "0.1.1"
description = "UmeYc-SteamBack Windows 游戏存档与夸克云同步"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "xiaochaom"}]
dependencies = ["PySide6-Essentials>=6.7,<7", "qrcode>=7.4,<9", "vdf>=3.4,<4", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.10,<7"]

[project.gui-scripts]
umeyc-steamback = "umeyc_steamback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
umeyc_steamback = ["assets/*.svg"]
